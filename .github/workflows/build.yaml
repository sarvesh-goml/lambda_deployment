name : Ci Pipeline

on: 
  push:
    branches:
      - dev

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build docker images
        run: docker build -t lambda_backend .

      - name: smoke test
        run: |
          docker run -d -p 9000:8080 --name test-container lambda_backend
          sleep 5
          response=$(curl -s -o /dev/null -w "%{http_code}" -XPOST "http://localhost:9000/2015-03-31/functions/function/invocations" -d '{"httpMethod":"GET","path":"/health","requestContext":{},"headers":{}}')
          echo response code: $response
          docker logs test-container
          docker stop test-container
          if [ "$response" -ne 200 ]; then
            echo "smoke test failed"
            exit 1
          fi

      - name: set up aws
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: push image to ecr
        id: push
        run: |
          aws ecr get-login-password --region ${{  secrets.AWS_REGION  }} | docker login --username AWS --password-stdin ${{  secrets.AWS_ACCOUNT_ID  }}.dkr.ecr.${{  secrets.AWS_REGION  }}.amazonaws.com
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/demo:latest
          docker tag lambda_backend:latest $IMAGE_URI
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
  
  deploy: 
    runs-on: ubuntu-latest
    needs: build_and_test

    steps:

      - name: set up aws
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: deploy to lambda
        run: |
          aws lambda update-function-code --function-name practice_lambda --image-uri ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/demo:latest

      - name: check live or not 
        run: | 
          curl ${{ secrets.AWS_LAMBDA_URL }}/docs
          echo "Lambda function invoked successfully."

          